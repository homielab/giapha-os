name: Feature request / Đề xuất tính năng
description: Suggest an idea / Đề xuất ý tưởng mới
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Vấn đề
      description: What are you trying to do and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution / Giải pháp đề xuất
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / Phương án khác đã cân nhắc
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I can open a pull request for this
